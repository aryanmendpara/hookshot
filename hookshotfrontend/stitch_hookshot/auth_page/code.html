<script>
  let currentAuthMode = 'login';

  function setAuthMode(mode) {
    currentAuthMode = mode;
    const tabLogin = document.getElementById('tab-login');
    const tabSignup = document.getElementById('tab-signup');
    const confirmContainer = document.getElementById('confirm-password-container');
    const confirmInput = document.getElementById('auth-password-confirm');
    const submitBtn = document.getElementById('submit-button');
    const switchBtn = document.getElementById('switch-mode-text');
    const forgotLink = document.getElementById('forgot-link');

    if (mode === 'login') {
      tabLogin.className = 'py-1.5 px-3 text-center font-label-md text-label-md transition-colors duration-100 bg-[#0c1821] text-on-surface border border-[#1b2a41] rounded';
      tabSignup.className = 'py-1.5 px-3 text-center font-label-md text-label-md transition-colors duration-100 text-outline hover:text-on-surface';
      
      confirmContainer.classList.add('hidden');
      confirmContainer.classList.remove('flex');
      confirmInput.removeAttribute('required');
      
      submitBtn.textContent = 'Authenticate';
      switchBtn.textContent = "Don't have an account? Sign up";
      forgotLink.style.display = 'inline-block';
    } else {
      tabSignup.className = 'py-1.5 px-3 text-center font-label-md text-label-md transition-colors duration-100 bg-[#0c1821] text-on-surface border border-[#1b2a41] rounded';
      tabLogin.className = 'py-1.5 px-3 text-center font-label-md text-label-md transition-colors duration-100 text-outline hover:text-on-surface';
      
      confirmContainer.classList.remove('hidden');
      confirmContainer.classList.add('flex');
      confirmInput.setAttribute('required', 'true');
      
      submitBtn.textContent = 'Provision Account';
      switchBtn.textContent = "Already have an account? Log in";
      forgotLink.style.display = 'none';
    }
  }

  function toggleAuthMode() {
    setAuthMode(currentAuthMode === 'login' ? 'signup' : 'login');
  }

  function handleAuthSubmit(e) {
    e.preventDefault();
    const btn = document.getElementById('submit-button');
    const prevText = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Verifying Handshake...';
    
    setTimeout(() => {
      btn.textContent = prevText;
      btn.disabled = false;
    }, 1200);
  }
</script></main>
